<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b2233">
<title>Тетрадката</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">

<style>
/* VOICE: a 12-year-old's own notebook – calm, a bit rock, never babyish.
   IDEA: the school exercise book; its cover is hers, red-pen stamps mark progress.
   PICTURE: cover band with her drawing, then the day's page; lessons with maps and timelines.
   COLOUR/TYPE: paper white, ink, faint rules, one accent she picks; Rubik + Caveat pen notes.
   LAYOUT: one column on phones, two-column cards from 760px; content max 980px. */
:root{color-scheme:light dark;
 --bg:light-dark(#f6f4ee,#121419);--paper:light-dark(#ffffff,#1b1e26);--ink:light-dark(#1b2233,#e6e8ef);
 --soft:light-dark(#5a6478,#9aa3b5);--rule:light-dark(#dbe5f5,#2a3140);--margin:light-dark(#f2b8b0,#6b3a35);
 --pen:light-dark(#c8321f,#ff7a66);--ok:light-dark(#1f6f4a,#6fd1a1);--chip:light-dark(#eef2fa,#252b38);
 --acc:#2348a8;--cover:#1b2233;--coverInk:#fff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Rubik,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:980px;margin:0 auto;padding:0 max(3.5vw,12px) 72px}
h1{font-size:clamp(28px,5vw,42px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:22px;line-height:1.2;margin:0 0 8px}h3{font-size:17px;margin:0 0 6px}
p{margin:0 0 10px}
.pen{font-family:Caveat,cursive;color:var(--pen);font-size:26px;line-height:1}
.muted{color:var(--soft);font-size:14px}
.page{background:var(--paper);border-radius:8px;box-shadow:0 1px 0 var(--rule),0 8px 30px -20px #0005;
 background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 32px;background-position:0 20px;
 padding:20px 18px 20px 50px;position:relative;margin-bottom:18px}
.page::before{content:"";position:absolute;top:0;bottom:0;left:34px;width:2px;background:var(--margin)}
.plain{background-image:none}
.grid{display:grid;gap:18px}@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.grid>.page{margin-bottom:0}
.cover{margin:0 calc(-1*max(3.5vw,12px)) 18px;padding:26px max(3.5vw,12px) 22px;background:var(--cover);color:var(--coverInk);position:relative;overflow:hidden;min-height:170px;display:flex;align-items:flex-end}
.cover .art{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.55}
.cover .art.pattern{opacity:.22;background-image:repeating-conic-gradient(from 0deg at 82% 40%,currentColor 0 1.2deg,transparent 1.2deg 7deg)}
.cover .in{position:relative;width:100%;max-width:980px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.cover .label{background:color-mix(in srgb,var(--paper) 92%,transparent);color:var(--ink);padding:10px 16px;border-radius:6px;box-shadow:0 4px 14px #0003}
.cover .label .muted{font-size:13px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin:-6px 0 16px;padding-bottom:2px}
nav.tabs a{flex:none;padding:8px 14px;border-radius:99px;color:var(--ink);text-decoration:none;font-size:15px;min-height:40px;display:inline-flex;align-items:center}
nav.tabs a.on{background:var(--ink);color:var(--paper)}
nav.tabs{align-items:center;overflow:visible;flex-wrap:nowrap}
@media(max-width:520px){nav.tabs{gap:0}.tabsc{gap:0}nav.tabs a{padding:8px 6px;font-size:14px}.more summary{padding:8px 8px}.more summary{padding:8px 12px}.wide{display:none}}
.more{margin-left:auto}
.tabsc{position:relative;display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}.tabsc::-webkit-scrollbar{display:none}
.more{position:relative;flex:none}.more summary{list-style:none;padding:8px 14px;border-radius:99px;min-height:40px;display:inline-flex;align-items:center;cursor:pointer;color:var(--ink)}.more summary::-webkit-details-marker{display:none}
.more[open] summary,.more.on summary{background:var(--chip)}
.more .menu{position:absolute;right:0;top:44px;z-index:20;background:var(--paper);border:1px solid var(--rule);border-radius:12px;box-shadow:0 12px 30px -12px #0006;padding:6px;min-width:210px;display:flex;flex-direction:column}
.more .menu a{padding:10px 12px;border-radius:8px;color:var(--ink);text-decoration:none}.more .menu a:hover,.more .menu a.on{background:var(--chip)}
.more .menu .modes{display:flex;gap:4px;padding:8px 6px 4px;border-top:1px solid var(--rule);margin-top:4px}
.modes button{min-height:34px;padding:4px 10px;font-size:14px;border-width:1px;flex:1}.modes button.on{background:var(--ink);color:var(--paper)}
.task{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}.task:last-child{border-bottom:0}
.task .num{font-family:Caveat,cursive;color:var(--pen);font-size:26px;line-height:1}
.task b{display:block}.task .muted{display:block}
.task .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.task .act button,.task .act .btn{min-height:40px;padding:6px 14px}
.task .sub{grid-column:2/4}
@media(max-width:520px){.task{grid-template-columns:28px 1fr}.task .act{grid-column:2/3;justify-content:flex-start}}
.ro .act button,.ro #start,.ro [data-prep],.ro #bigrev,.ro #fix{pointer-events:none;opacity:.45}
.formfield{display:block;margin:0 0 12px}.formfield select{display:block;width:100%;margin-top:4px;font:inherit;min-height:44px;padding:6px 10px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:99px;padding:3px 11px;font-size:14px;white-space:nowrap}
.chip.hot{background:var(--acc);color:#fff}
button,.btn{font:inherit;cursor:pointer;border-radius:10px;min-height:44px;padding:8px 18px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.go,.btn.go{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500;font-size:17px}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;text-decoration:underline;padding:8px 4px;min-height:44px;color:var(--acc)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.dots{display:flex;gap:6px}.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}.dot.on{background:var(--pen);border-color:var(--pen)}
.bar{height:8px;border-radius:9px;background:var(--rule);overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc)}
.big{font-size:clamp(44px,9vw,72px);font-family:Caveat,cursive;color:var(--pen);line-height:1}
/* subjects */
.subj{display:flex;justify-content:flex-start;gap:14px;align-items:center;cursor:pointer;text-align:left;width:100%;border:0;background:none;padding:0;min-height:0;color:inherit}
.ring{flex:none;width:58px;height:58px}
.lv{display:inline-flex;gap:3px}.lv i{width:10px;height:10px;border-radius:2px;background:var(--rule)}.lv i.on{background:var(--acc)}
/* manga */
.buddy{display:flex;gap:12px;align-items:flex-end;margin:6px 0 4px}
.buddy svg{flex:none;width:76px;height:76px}
.buddy img.pal{flex:none;width:76px;height:76px;object-fit:contain}
.cards4{display:grid;gap:14px}@media(min-width:620px){.cards4{grid-template-columns:1fr 1fr}}
.dcard{border:1px solid var(--rule);border-radius:14px;padding:14px 16px;background:var(--paper);display:flex;flex-direction:column;gap:6px}
.dcard .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600}
.dcard h3{margin:0}.dcard .row{margin-top:auto}
.dcard.soon{opacity:.7}
.studio{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.scard{border:1px solid var(--rule);border-radius:14px;background:var(--paper);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;cursor:pointer;text-align:left;padding:0;min-height:0}
.scard .pic{aspect-ratio:1;background:var(--chip);display:grid;place-items:center;overflow:hidden}.scard .pic img{width:100%;height:100%;object-fit:contain}
.scard .tx{padding:8px 10px}.scard .tx b{display:block}.scard .tx span{font-size:12px;color:var(--soft)}
.field{display:block;margin:0 0 12px}.field input[type=text],.field textarea,.field select{display:block;width:100%;margin-top:4px;font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
.bubble{position:relative;background:#fff;color:#1b2233;border:2.5px solid #1b2233;border-radius:18px;padding:8px 14px;font-weight:500;font-size:15.5px;max-width:420px;margin-bottom:22px}
.bubble::after{content:"";position:absolute;left:-12px;bottom:10px;border:8px solid transparent;border-right:12px solid #1b2233}
.bubble::before{content:"";position:absolute;left:-7px;bottom:12px;border:6px solid transparent;border-right:9px solid #fff;z-index:1}
.tone{background-image:radial-gradient(color-mix(in srgb,var(--ink) 14%,transparent) 1px,transparent 1.3px);background-size:7px 7px}
.readlist a{font-weight:500}
.banner{background:var(--acc);color:#fff;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:15px}
/* stamps */
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,118px));gap:14px}
.stamp{aspect-ratio:1;border:3px double var(--pen);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--pen);transform:rotate(-8deg);padding:8px;font-family:Caveat,cursive;font-size:19px;line-height:1.05}
.stamp small{font-family:Rubik;font-size:10.5px;color:var(--soft);margin-top:4px;line-height:1.2}
.stamp.off{opacity:.28;filter:grayscale(1)}
/* runner */
.sec{display:grid;gap:18px}
@media(min-width:820px){.sec.withtext{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}.sec.withtext .text{position:sticky;top:12px;max-height:92vh;overflow:auto}}
.text{white-space:pre-line;background:var(--chip);border-radius:8px;padding:16px 18px;font-size:16.5px;line-height:1.7}
.q{padding:14px 0;border-bottom:1px dashed var(--rule)}
.q p{font-weight:500}
.opts{display:grid;gap:8px}
.opt{text-align:left;justify-content:flex-start;border:2px solid var(--rule);background:var(--paper);font-weight:400}
.opt.sel{border-color:var(--acc);background:var(--chip)}
.opt.right{border-color:var(--ok)}.opt.wrong{border-color:var(--pen);text-decoration:line-through}
.opt:disabled{opacity:1;color:var(--ink)}
input[type=text],textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;border-radius:8px;border:2px solid var(--rule);background:var(--paper);color:var(--ink)}
input[type=text]{max-width:260px}textarea{min-height:110px;resize:vertical}
.unit{margin-left:8px;color:var(--soft)}
.fb{margin-top:10px;padding:10px 12px;border-left:3px solid var(--pen);background:light-dark(#fff5f3,#2a1d1d);border-radius:0 8px 8px 0;font-size:15px}
.fb.ok{border-color:var(--ok);background:light-dark(#f1faf5,#16271f)}
.fb b{font-family:Caveat,cursive;font-size:24px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:8px 6px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}td.n{text-align:right;white-space:nowrap}
details summary{cursor:pointer;color:var(--acc);min-height:32px}
/* lesson */
.lesson .blk{margin:0 0 22px}
.hook{font-size:19px;line-height:1.55;border-left:4px solid var(--acc);padding:4px 0 4px 16px}
figure{margin:0}figure img{width:100%;max-height:420px;object-fit:contain;background:var(--chip);border-radius:8px}
figcaption{font-size:14px;color:var(--soft);margin-top:6px}
.mapbox{position:relative;background:light-dark(#f3efe4,#22252c);border-radius:10px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.mpt{cursor:pointer}.mpt:focus{outline:none}.mpt:focus circle{stroke:var(--acc);stroke-width:4}
.mapinfo{min-height:56px;padding:10px 12px;font-size:15px;background:var(--chip);border-radius:0 0 10px 10px}
.tl{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 12px}
.tl button{flex:none;scroll-snap-align:start;width:150px;min-height:110px;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;border:2px solid var(--rule);padding:10px}
.tl button b{font-family:Caveat,cursive;font-size:28px;color:var(--pen);line-height:1}
.tl button.on{border-color:var(--acc);background:var(--chip)}
.flip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.flip button{min-height:96px;border:2px solid var(--rule);flex-direction:column;font-weight:500}
.flip button.on{background:var(--chip);font-weight:400;font-size:14.5px;border-color:var(--acc)}
.ord{display:grid;gap:8px}.ord button{justify-content:flex-start;border:2px solid var(--rule);text-align:left}
.ord button.done{border-color:var(--ok)}.ord button.bad{border-color:var(--pen)}
.callout{background:var(--chip);border-radius:10px;padding:14px 16px}
.links{display:grid;gap:10px}@media(min-width:700px){.links{grid-template-columns:1fr 1fr}}
.links .callout b{display:block;margin-bottom:4px;color:var(--acc)}
.sum li{margin-bottom:6px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}.swatches button{width:56px;height:56px;padding:0;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--rule)}
.swatches button.on{box-shadow:0 0 0 3px var(--ink)}
@media(max-width:600px){.page{padding:16px 12px 16px 32px}.page::before{left:20px}}
@media(prefers-reduced-motion:no-preference){.fb{animation:fin .35s ease-out}.stamp.new{animation:sin .6s ease-out}@keyframes fin{from{opacity:0;transform:translateY(-4px)}}@keyframes sin{from{opacity:0;transform:scale(1.6) rotate(-20deg)}to{opacity:1;transform:rotate(-8deg)}}}

/* Learning Journal — presentation layer */
:root{--bg:light-dark(#f1eee7,#181920);--paper:light-dark(#fffcf6,#24252e);--ink:light-dark(#282632,#eeeaf1);--soft:light-dark(#625d6b,#b8b4c2);--rule:light-dark(#ded9d3,#41414d);--chip:light-dark(#ece8e2,#30313d);--pen:light-dark(#795165,#d4a6b9);--margin:transparent;--ok:light-dark(#386746,#b4ce93);--link:light-dark(#62458d,#c6b5ed);--urgent:light-dark(#f5e7e7,#382b37);--urgentInk:light-dark(#813e55,#e6b5c3)}
body{font:16px/1.6 Rubik,system-ui,sans-serif} a{color:var(--link);text-underline-offset:3px} .wrap{max-width:1440px;padding:24px 32px 64px} h1,h2,h3{letter-spacing:-.025em} h2{font-size:24px}h3{font-size:19px}.pen{font-family:Rubik,system-ui,sans-serif;font-size:22px;font-weight:700;line-height:1.3}.muted{font-size:14px}.page{background-image:none;border:1px solid var(--rule);border-radius:16px;padding:24px;box-shadow:none}.page:before{display:none}.cover{margin:0 0 18px;min-height:132px;border-radius:18px;padding:22px 28px;align-items:center;background:var(--paper);color:var(--ink);border:1px solid var(--rule)}.cover .art{inset:0 0 0 auto;width:34%;background-size:cover;mask-image:linear-gradient(to right,transparent,#000 30%);opacity:.72!important}.cover .in{max-width:none;align-items:center}.cover .label{background:none;box-shadow:none;padding:0;max-width:70%}.cover h1{font-size:clamp(28px,3vw,40px)}.cover .label .muted{font-size:13px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}.cover .btn{border:1px solid var(--rule)!important}.tabs{background:var(--paper);padding:7px!important;border:1px solid var(--rule);border-radius:13px;margin:0 0 22px!important;gap:5px!important}.tabs a,.more summary{border-radius:8px!important;font-weight:500}.tabs a.on{background:var(--ink);color:var(--paper)}.tabsc{gap:5px}.tabs a:hover{background:var(--chip)}.tabs a.on:hover{background:var(--ink)}button,.btn{border:1px solid var(--rule);border-radius:9px;font-weight:500;min-height:44px}button:hover,.btn:hover{box-shadow:inset 0 0 0 1px var(--soft)}button.go,.btn.go{background:var(--acc);color:#fff;font-size:16px}.link,details summary,.links .callout b{color:var(--link)}.task{grid-template-columns:30px minmax(0,1fr) auto;gap:12px;padding:16px 0}.task .num{font-family:Rubik,system-ui,sans-serif;font-size:18px;font-weight:500;color:var(--soft)}.task b{font-size:16px}.task .sub{grid-column:2/-1}.task .sub .btn{font-size:14px;min-height:40px}.buddy{align-items:center;margin:0 0 18px}.buddy svg,.buddy img.pal{width:64px;height:64px}.bubble{background:var(--chip);color:var(--ink);border:1px solid var(--rule);border-radius:12px;margin-bottom:0;max-width:none;font-size:15px}.bubble:before,.bubble:after{display:none}.buddy .pen{font-size:14px!important}.home-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:22px;align-items:start}.home-main,.home-side{display:grid;gap:18px}.home-main>.page,.home-side>.page{margin:0!important}.home-main .plan-page{padding:26px}.home-side .page{padding:20px}.home-side .task{grid-template-columns:26px 1fr;gap:8px}.home-side .task .act{grid-column:2;justify-content:flex-start}.home-side .task .num{color:var(--urgentInk)}.home-side .upcoming{background:var(--urgent);border-color:color-mix(in srgb,var(--urgentInk) 28%,var(--rule))}.home-side .upcoming h3{color:var(--urgentInk)}.plan-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px}.plan-head h2{margin:0}.plan-head span{font-size:13px;color:var(--soft)}.plan-page .task:first-of-type{border-top:1px solid var(--rule)}.task.priority{background:var(--urgent);padding:14px 12px;border-radius:11px;margin:8px 0;border:0}.task.priority .num{color:var(--urgentInk)}.extras{display:grid;grid-template-columns:1fr 1fr;gap:12px}.extras a{display:block;background:var(--chip);color:var(--ink);padding:16px;border-radius:12px;text-decoration:none;border:1px solid var(--rule)}.extras a b{display:block;margin-bottom:4px}.subject-tile{background:var(--chip);border:1px solid var(--rule);padding:14px;border-radius:12px;min-height:86px;--subject:var(--link)}.subject-tile .ring{width:42px;height:42px}.subject-tile .ring circle:last-child{stroke:var(--subject)}.subject-tile .muted{font-size:13px}.subject-tile[data-subject=bel]{--subject:light-dark(#875a99,#c5a6de)}.subject-tile[data-subject=mat]{--subject:light-dark(#425e97,#a5b9e9)}.subject-tile[data-subject=chp]{--subject:light-dark(#49723f,#b5ce92)}.subject-tile[data-subject=ist]{--subject:light-dark(#916037,#e0b58c)}.subject-tile[data-subject=geo]{--subject:light-dark(#347579,#9ecad0)}.subject-tile[data-subject=eng]{--subject:light-dark(#965671,#d5aac2)}.home-side .chips{display:grid;grid-template-columns:1fr;gap:5px;counter-reset:period}.home-side .chip{white-space:normal;background:var(--chip);color:var(--ink);border-radius:7px;padding:5px 10px}.home-side .chip:before{counter-increment:period;content:counter(period,decimal-leading-zero) '  ';color:var(--soft);font-variant-numeric:tabular-nums}.home-side .chip.hot{font-weight:500}.lesson{max-width:900px;margin-inline:auto;padding:clamp(18px,4vw,44px);line-height:1.7}.lesson .blk{margin-bottom:28px}.lesson .hook{font-size:21px}.q{border-color:var(--rule)}.dcard,.scard{border-radius:12px}.studio{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.scard .tx{padding:14px}.stamp{color:var(--pen)}.preview-note{padding:9px 14px;background:var(--chip);color:var(--soft);font-size:13px;border-radius:8px;margin-bottom:14px}.schedule-switch{display:flex;gap:6px;margin-bottom:10px}.schedule-switch button{font-size:14px;min-height:38px;padding:5px 12px}.schedule-switch button[aria-pressed=true]{background:var(--ink);color:var(--paper)}

/* attempts: append-only log of every answer. a={t,s,i,sk,p,m,c}: time, source session/lesson id, original item id, skill, points, max, context */
function splitRef(sid,iid){if(String(sid).startsWith('R-')){const k=String(iid).indexOf('__');if(k>0)return[iid.slice(0,k),iid.slice(k+2)]}return[sid,iid]}

/* ---------- derived data ---------- */
const skillName=k=>{const p=Object.keys(SKILL).filter(s=>k.startsWith(s)).sort((a,b)=>b.length-a.length)[0];return p?SKILL[p]:k};

function allRecords(){const out=[];for(const r of Object.values(S.results))for(const [iid,x] of Object.entries(r.items||{}))out.push({...x,iid,sid:r.sid,date:String(r.finishedAt||'').slice(0,10)});return out}
function topicStats(t){const A=(S.attempts||[]).filter(a=>t.skills.some(p=>(a.sk||'').startsWith(p)));const last={};for(const a of A){const k=a.s+'__'+a.i;if(!last[k]||last[k].t<=a.t)last[k]=a}const L=Object.values(last);const p=L.reduce((x,a)=>x+a.p,0),m=L.reduce((x,a)=>x+a.m,0);const days=[...new Set(A.map(a=>String(a.t).slice(0,10)))].sort();const ld=days[days.length-1];const lastDay=A.filter(a=>String(a.t).slice(0,10)===ld);const lp=lastDay.reduce((x,a)=>x+a.p,0),lm=lastDay.reduce((x,a)=>x+a.m,0);return{n:L.length,tries:A.length,acc:m?p/m:0,days:days.length,lastAcc:lm?lp/lm:0}}
function topicLevel(t){const st=topicStats(t),opened=!!S.prog.lessons[t.id];if(!st.n)return opened?1:0;if(st.acc<.5)return 1;if(st.acc<.8||st.n<4)return 2;if(st.days>=2&&st.lastAcc>=.85)return 4;return 3}

function findItem(sid,iid){if(String(sid).startsWith('R-')){const k=String(iid).indexOf('__');if(k<0)return null;const f=findItem(iid.slice(0,k),iid.slice(k+2));if(!f)return null;return{it:{...f.it,id:iid},sec:f.sec,s:reviewSession(sid)||f.s}}let s;if(String(sid).startsWith('L-')){const L=S.lessons[sid.slice(2)];if(!L)return null;s=lessonAsSession(L)}else s=S.sessions.find(x=>x.id===sid);if(!s)return null;for(const sec of s.sections||[])for(const it of sec.items||[])if(it.id===iid)return{it,sec,s};return null}
function lessonsFor(sess){if(!sess)return[];const sk=(sess.sections||[]).flatMap(x=>x.items||[]).map(i=>i.skill||'');return subjects().flatMap(s=>(s.topics||[]).filter(t=>t.lesson&&S.lessons[t.id]&&((t.sessions||[]).includes(sess.id)||sk.some(k=>t.skills.some(p=>k.startsWith(p))))).map(t=>({t,s})))}
const lessonBtns=(sess,label)=>lessonsFor(sess).map(({t})=>`<a class="btn" href="#lesson-${esc(t.id)}">${label||'Урок'}: ${esc(t.title)}</a>`).join('');
/* ---------- big review & test prep ---------- */
function lastAttempts(){const m={};for(const r of Object.values(S.results))for(const [iid,x] of Object.entries(r.items||{})){let src=r.sid,orig=iid;if(String(r.sid).startsWith('R-')){const k=iid.indexOf('__');if(k<0)continue;src=iid.slice(0,k);orig=iid.slice(k+2)}const key=src+'__'+orig,d=String(r.finishedAt||'');if(!m[key]||m[key].d<d)m[key]={ok:x.pts>=x.max,d}}return m}
function itemPool(skills,onlySeen){const out=[];const add=(sess)=>{for(const sec of sess.sections||[])for(const it of sec.items||[]){if(skills&&!skills.some(p=>(it.skill||'').startsWith(p)))continue;out.push({src:sess.id,it,sec})}};

 for(const [id,L] of Object.entries(S.lessons))if(!onlySeen||S.results['L-'+id]?.done)add(lessonAsSession(L));return out}
function reviewSession(id){const rv=(S.prog.reviews||{})[id]||S.results[id];if(!rv||!rv.refs)return null;const items=rv.refs.map(([src,iid])=>{let f=null;if(String(src).startsWith('L-')){const L=S.lessons[src.slice(2)];if(L){const s=lessonAsSession(L);for(const sec of s.sections)for(const it of sec.items)if(it.id===iid)f={it,sec}}}else{const s=S.sessions.find(x=>x.id===src);if(s)for(const sec of s.sections)for(const it of sec.items)if(it.id===iid)f={it,sec}}return f&&{...f.it,id:src+'__'+iid,_text:f.sec.text}}).filter(Boolean);

function buildReview(kind,title,skills,n,groups,minPer,flt){const la=lastAttempts(),now=Date.now();let pool=itemPool(skills,kind==='bigreview').filter(p=>!flt||flt(p,la[p.src+'__'+p.it.id])).map(p=>{const a=la[p.src+'__'+p.it.id];const age=a?(now-Date.parse(a.d))/864e5:0;const w=a?(1+(a.ok?0:3)+Math.min(4,age/7)):1.5;return{...p,w}});
 const pick=[];let opens=0;const take=(flt,k)=>{let got=0;while(got<k&&pick.length<n){const cand=pool.filter(flt);if(!cand.length)break;const tot=cand.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot,i=0;while(i<cand.length-1&&(r-=cand[i].w)>0)i++;const p=cand[i];pool.splice(pool.indexOf(p),1);if(p.it.type==='open'){if(opens>=2)continue;opens++}pick.push(p);got++}};
 for(const g of groups||[])take(p=>g.some(pre=>(p.it.skill||'').startsWith(pre)),minPer||2);
 take(()=>true,n);

 const id='R-'+new Date().toISOString().replace(/[^0-9]/g,'').slice(0,12);S.prog.reviews??={};S.prog.reviews[id]={title,kind,refs:mixed.map(p=>[p.src,p.it.id]),created:today()};persist();return reviewSession(id)}

function seededOrder(id,n){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){h=(h*1103515245+12345)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

 ${(()=>{const nx=sessionsSorted().find(s=>!S.results[s.id]?.done&&s.id!==run.sess?.id);return `<div class="row" style="margin-top:14px"><button class="go" id="home">Към началото</button>${run.sess?lessonBtns(run.sess,'Урок'):''}${nx?`<button id="more">Още едно: ${esc(nx.title)}</button>`:''}</div>`})()}</section>`;
 document.getElementById('home').onclick=()=>{run=null;go('#home')};
 document.getElementById('more')?.addEventListener('click',()=>{const nx=sessionsSorted().find(s=>!S.results[s.id]?.done);run=null;if(nx)startRun(nx)})}
function renderView(sid){const r=S.results[sid];let s=sid.startsWith('R-')?reviewSession(sid):sid.startsWith('L-')?(S.lessons[sid.slice(2)]&&lessonAsSession(S.lessons[sid.slice(2)])):S.sessions.find(x=>x.id===sid);if(!s||!r)return renderJournal();
 frame('#journal',`<div class="top"><a href="#journal">← Дневник</a><span class="muted">${esc(fmtDate(r.finishedAt))}</span></div><section class="page"><div class="pen">${esc(r.score)}/${esc(r.max)}</div><h2>${esc(s.title)}</h2>${(()=>{const runs={};for(const a of S.attempts||[])if(a.s===sid&&a.c!=='review'){const k=a.r||String(a.t).slice(0,16);(runs[k]??={p:0,m:0,t:a.t});runs[k].p+=a.p;runs[k].m+=a.m}const L=Object.values(runs).sort((a,b)=>a.t<b.t?-1:1);return L.length>1?`<p class="muted">Опити: ${L.map(x=>`${esc(fmtDate(x.t))} – ${x.p}/${x.m}`).join(' · ')}</p>`:''})()}${s.sections.map(sec=>`<h3 style="margin-top:14px">${esc(sec.title)}</h3>${sec.text?`<details><summary>Текстът</summary><div class="text">${esc(sec.text)}</div></details>`:''}${sec.items.map(it=>{const x=r.items?.[it.id];const ok=x&&x.pts>=x.max;return `<div class="q"><p>${esc(it.q)}</p><div>Твоят отговор: ${esc(x?.given||'—')}</div><div class="fb ${ok?'ok':''}"><b>${x?esc(x.pts)+'/'+esc(x.max):'—'}</b> ${it.type==='open'?esc('Примерно: '+it.model):esc(it.explain)}</div></div>`}).join('')}`).join('')}<div class="row" style="margin-top:12px"><button class="go" id="again">Реши отново</button></div></section>`);
 document.getElementById('again').onclick=()=>startRun(s)}

/* ---------- journal, stamps, report, cover ---------- */
function renderJournal(){const R=Object.values(S.results).sort((a,b)=>String(b.finishedAt).localeCompare(String(a.finishedAt)));const by={};for(const r of R)(by[String(r.finishedAt).slice(0,10)]??=[]).push(r);
 const recs=allRecords(),acc=recs.length?Math.round(100*recs.reduce((a,x)=>a+x.pts,0)/recs.reduce((a,x)=>a+x.max,0)):0;
 frame('#journal',`<div class="grid three"><section class="page plain"><div class="big">${R.filter(r=>r.done).length}</div><p class="muted">решени сесии и уроци</p></section><section class="page plain"><div class="big">${recs.length}</div><p class="muted">решени задачи</p></section><section class="page plain"><div class="big">${acc}%</div><p class="muted">точност общо</p></section></div><div style="height:18px"></div>
 ${RO?'':`<section class="page"><h3>Преговор по желание</h3><p class="muted">Смесени задачи от всичко решено досега – повече от тези с грешки и от по-старите.</p><button class="go" id="bigrev2">Направи преговор сега</button></section>`}<section class="page"><h2>Дневник</h2>${R.length?Object.entries(by).map(([d,rs])=>`<h3 style="margin-top:12px">${esc(fmtDate(d))}</h3><ul class="list">${rs.map(r=>`<li><span>${esc(r.title)}${r.done?'':' <span class="muted">(незавършена)</span>'}</span><span class="row"><span class="pen">${esc(r.score)}/${esc(r.max)}</span><a class="btn" href="#view-${esc(r.sid)}">Виж</a></span></li>`).join('')}</ul>`).join(''):'<p class="muted">Тук ще се пази всичко, което решиш – можеш да се върнеш към всяка сесия.</p>'}</section>
 <section class="page"><h3>Всички упражнения</h3><ul class="list">${sessionsSorted().map(s=>{const r=S.results[s.id];return `<li><span><span class="muted">${esc(fmtDate(s.date))}</span> · ${esc(s.title)}</span>${r?.done?`<a class="btn" href="#view-${esc(s.id)}">Виж</a>`:`<button data-run="${esc(s.id)}">Реши</button>`}</li>`}).join('')}</ul></section>`);
 root.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>startRun(S.sessions.find(x=>x.id===b.dataset.run)));
 document.getElementById('bigrev2')?.addEventListener('click',startBigReview)}
function renderStamps(){const L=stampList();frame('#stamps',`<section class="page"><h2>Печати</h2><p class="muted">${L.filter(s=>s.ok).length} от ${L.length}. Бледите още чакат.</p><div class="stamps" style="margin-top:12px">${L.map(s=>stampHTML(s)).join('')}</div></section>
 <section class="page"><h3>Нива на темите</h3><p>Всяка тема минава през 4 нива: ${LEVELS.slice(1).map((n,i)=>`<b>${i+1}.</b> ${n}`).join(' → ')}.</p><p class="muted">„Овладяна“ значи, че си я решила вярно и в друг ден, не само веднъж – тогава знанието остава.</p></section>`)}
function reportText(){const done=Object.values(S.results).filter(r=>r.done);let t=`ТЕТРАДКАТА – отчет към ${today()}\nРешени: ${done.length}\n`+done.map(r=>`- ${r.title}: ${r.score}/${r.max} (${String(r.finishedAt||'').slice(0,10)})`).join('\n');
 t+='\n\nТЕМИ:\n'+subjects().flatMap(s=>(s.topics||[]).filter(x=>!x.soon).map(x=>{const st=topicStats(x);return `- ${s.short}: ${x.title} – ${LEVELS[topicLevel(x)]}${st.n?` (${Math.round(st.acc*100)}%, ${st.n} задачи)`:''}`})).join('\n');
 t+='\n\nПО УМЕНИЯ (най-слабите първо):\n'+stats().map(([n,a])=>`- ${n}: ${Math.round(100*a.p/a.m)}% (${a.c})`).join('\n');
 const opens=allRecords().filter(x=>x.type==='open').slice(-10);t+=`\n\nПИСМЕНИ ОТГОВОРИ (самооценка):\n`+opens.map(o=>{const f=findItem(o.sid,o.iid);return `Въпрос: ${f?.it.q||o.iid}\nОтговор: ${o.given}\nСамооценка: ${o.pts}/2`}).join('\n\n');
 const wrong=allRecords().filter(x=>x.type!=='open'&&x.pts<x.max).map(x=>findItem(x.sid,x.iid)).filter(Boolean).slice(-12);t+=`\n\nГРЕШКИ:\n`+wrong.map(f=>`- ${f.it.q}`).join('\n');return t}
function downloadBackup(){S.backupAt=new Date().toISOString();persist();const b=new Blob([JSON.stringify({results:S.results,review:S.review,prog:S.prog,attempts:S.attempts,savedAt:S.backupAt},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tetradka-kopie-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function renderReport(){const rows=stats();
 frame('#report',`<section class="page"><div class="pen">Отчет</div><h2>Как върви</h2><p class="muted">Изпрати отчета на мама веднъж седмично – Claude ще го прегледа и ще остави бележки тук, в „Днес“.</p><div class="row"><button class="go" id="share">Изпрати отчета</button><button id="copy">Копирай</button><span class="muted" id="msg"></span></div></section>
 <section class="page"><h3>Теми по предмети</h3>${subjects().filter(s=>(s.topics||[]).some(t=>!t.soon)).map(s=>`<p style="margin-top:10px"><b>${esc(s.short)}</b></p><ul class="list">${s.topics.filter(t=>!t.soon).map(t=>`<li><span>${esc(t.title)}</span>${lvHTML(topicLevel(t))}</li>`).join('')}</ul>`).join('')}</section>
 <section class="page"><h3>Успеваемост по умения</h3>${rows.length?`<table><thead><tr><th>Умение</th><th>Задачи</th><th>Точки</th><th style="width:30%"></th></tr></thead><tbody>${rows.map(([n,a])=>`<tr><td>${esc(n)}</td><td class="n">${a.c}</td><td class="n">${Math.round(100*a.p/a.m)}%</td><td><div class="bar"><i style="width:${Math.round(100*a.p/a.m)}%"></i></div></td></tr>`).join('')}</tbody></table>`:'<p class="muted">Ще се появи след първата сесия.</p>'}</section>
 <section class="page"><h3>Резервно копие</h3><p class="muted">Резултатите са само на това устройство. При смяна на устройство – изтегли копие и го зареди на новото.</p><div class="row"><button id="backup">Изтегли копие</button><label class="link" style="cursor:pointer">Зареди копие<input type="file" id="restore" accept=".json,application/json" hidden></label><span class="muted" id="bmsg"></span></div></section>`);
 const msg=document.getElementById('msg');
 document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(reportText());msg.textContent='Копирано.'}catch(e){msg.textContent='Не успях да копирам.'}};
 document.getElementById('share').onclick=async()=>{const text=reportText();if(navigator.share){try{await navigator.share({title:'Тетрадката – отчет',text});return}catch(e){if(e&&e.name==='AbortError')return}}try{await navigator.clipboard.writeText(text);msg.textContent='Копирано – постави го в съобщение до мама.'}catch(e){msg.textContent='Използвай „Копирай“.'}};
 document.getElementById('backup').onclick=()=>{downloadBackup();document.getElementById('bmsg').textContent='Изтеглено.'};
 document.getElementById('restore').onchange=async e=>{const f=e.target.files[0];if(!f)return;const bm=document.getElementById('bmsg');try{const x=JSON.parse(await f.text());if(!x||typeof x.results!=='object')throw 0;S.results={...S.results,...x.results};S.review={...S.review,...(x.review||{})};if(x.prog)S.prog.lessons={...S.prog.lessons,...(x.prog.lessons||{})};if(Array.isArray(x.attempts)){const seen=new Set(S.attempts.map(a=>a.t+a.s+a.i));S.attempts=S.attempts.concat(x.attempts.filter(a=>!seen.has(a.t+a.s+a.i))).sort((a,b)=>a.t<b.t?-1:1)}persist();bm.textContent='Копието е заредено.'}catch(err){bm.textContent='Този файл не е копие от тетрадката.'}}}
function renderCover(){const t=S.settings.theme;frame('',`<section class="page"><h2>Моята корица</h2><p>Сложи своя рисунка или снимка на корицата и избери цвят. Само ти я виждаш – пази се на това устройство.</p>
 <div class="row"><label class="btn go" style="cursor:pointer">Избери картинка<input type="file" id="cv" accept="image/*" hidden></label>${cover()?'<button id="cvx">Махни картинката</button>':''}<span class="muted" id="cvm"></span></div>
 <h3 style="margin-top:20px">Цвят</h3><div class="swatches">${Object.entries(THEMES).map(([k,v])=>`<button data-th="${k}" class="${k===t?'on':''}" style="background:linear-gradient(135deg,${v.c} 50%,${v.a} 50%)" aria-label="${esc(v.n)}" title="${esc(v.n)}"></button>`).join('')}</div>
 <div class="row" style="margin-top:20px"><a class="btn" href="#home">Готово</a></div></section>
 ${keyHTML()}${S.P?.syncUrl?`<section class="page"><h3>Връзка с мама и татко</h3><p class="muted">Ако мама ти е дала код, въведи го тук веднъж. Тогава след всяко упражнение напредъкът ти се записва и при нея.</p><div class="row"><input type="text" id="sk" value="${esc(lget(LSK))}" placeholder="Код" autocomplete="off"><button id="sks">Запази</button><span class="muted" id="skm">${lget(LSK)?'Свързано':''}</span></div><p style="margin-top:8px">${syncStatusHTML()}</p></section>`:''}`);
 wireKey();document.getElementById('sks')?.addEventListener('click',()=>{lset(LSK,document.getElementById('sk').value.trim());syncPush(null).then(ok=>{document.getElementById('skm').innerHTML=ok?'Свързано ✓':ok===false?'Кодът или връзката не стават':''});document.getElementById('skm').textContent=lget(LSK)?'Проверявам…':'Изключено'});
 root.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{S.settings.theme=b.dataset.th;persist();applyTheme();renderCover()});
 document.getElementById('cvx')?.addEventListener('click',()=>{try{localStorage.removeItem(LSC)}catch(e){}renderCover()});
 document.getElementById('cv').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{const W=1200,sc=Math.min(1,W/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let d=c.toDataURL('image/jpeg',.8);try{localStorage.setItem(LSC,d);renderCover()}catch(err){document.getElementById('cvm').textContent='Картинката е твърде голяма.'}URL.revokeObjectURL(u)};img.src=u}}

function renderParent(){if(RO)return go('#home');
 root.innerHTML=`<div style="height:24px"></div>${keyHTML()}<section class="page"><h2>Изглед за родител</h2>${S.P?.syncUrl?`<p>Въведете родителския код. Ще видите напредъка на ${esc(S.P.student||'детето')}, синхронизиран след последното ѝ упражнение. Кодът се помни на това устройство.</p><div class="row"><input type="text" id="pk" value="${esc(lget(LSP))}" placeholder="Родителски код" autocomplete="off"><button class="go" id="pg">Покажи</button><span class="muted" id="pm"></span></div>`:'<p>Синхронизацията още не е настроена.</p>'}<p style="margin-top:14px"><a href="#home">← Към тетрадката</a></p></section>`;
 wireKey(); document.getElementById('pg')?.addEventListener('click',async()=>{const k=document.getElementById('pk').value.trim(),m=document.getElementById('pm');m.textContent='Зареждам…';try{const r=await fetch(S.P.syncUrl+'?key='+encodeURIComponent(k));const x=await r.json();if(!x||!x.state){m.textContent=x&&x.error==='key'?'Грешен код.':'Още няма данни.';return}lset(LSP,k);RO=true;SYNC_AT=x.savedAt||'';S.results=x.state.results||{};S.review=x.state.review||{};S.prog=x.state.prog||{lessons:{}};S.prog.lessons??={};S.attempts=Array.isArray(x.state.attempts)?x.state.attempts:seedAttempts();go('#home')}catch(e){m.textContent='Не успях да се свържа.'}})}

/* ---------- private (encrypted) ---------- */
async function loadPrivate(){const k=lget(LKEY);PRIV_BAD=false;if(!k)return null;try{const e=await fetch('private.enc',{cache:'no-cache'}).then(r=>r.json());const d=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(k),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(e.salt),iterations:e.iter||150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(e.iv)},key,d(e.ct));return JSON.parse(new TextDecoder().decode(pt))}catch(err){PRIV_BAD=true;return null}}
function applyPrivate(pv){PRIV=pv;if(!pv)return;for(const k of ['student','schedule','schoolStarts','syncUrl'])if(pv[k]!==undefined)S.P[k]=pv[k];S.P.tests=pv.tests||[];S.feedback=Array.isArray(pv.feedback?.items)?pv.feedback.items:[]}
function keyHTML(){if(PRIV)return '';return `<section class="page"><h3>Ключ на тетрадката</h3><p class="muted">${PRIV_BAD?'Ключът не става – провери го.':'Разписанието, датите на контролните и бележките са шифровани. Въведи ключа веднъж на това устройство.'}</p><div class="row"><input type="text" id="tk" placeholder="Ключ" autocomplete="off"><button id="tks">Отключи</button></div></section>`}
function wireKey(){document.getElementById('tks')?.addEventListener('click',async()=>{lset(LKEY,document.getElementById('tk').value.trim());applyPrivate(await loadPrivate());route()})}
/* ---------- load ---------- */
async function takeKeyFromHash(){const hm=location.hash.match(/^#k=([\w-]+)/);history.replaceState(null,'',location.pathname+location.search+'#home');if(hm){lset(LKEY,hm[1]);return true}return false}
if(/^#k=/.test(location.hash))takeKeyFromHash();
window.tetradka={get S(){return S},buildReview,testTopics,thinTopics};
loadStore();applyTheme();
const J=u=>fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()});
Promise.all([J('platform.json'),J('sessions.json'),loadPrivate(),J('discover.json').catch(()=>null),studioLoad()]).then(async([P,sess,pv,disc])=>{S.discover=disc;
 S.P=P;S.P.tests=[];S.feedback=[];S.sessions=(Array.isArray(sess)?sess:[]).filter(s=>s&&Array.isArray(s.sections));applyPrivate(pv);
 const ls=P.subjects.flatMap(s=>(s.topics||[]).filter(t=>t.lesson));
 await Promise.all(ls.map(t=>J(t.lesson).then(L=>{S.lessons[t.id]=L}).catch(()=>{})));
 S.seen=S.seen.length?S.seen:stampList().filter(s=>s.ok).map(s=>s.id).filter(()=>false);
 loaded=true;route();
}).catch(()=>{loadErr=true;loaded=true;route()});
}
</script>
